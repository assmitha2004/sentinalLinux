# TLS reverse proxy: serves the built dashboard and proxies the API + Socket.IO.
# Build the client with VITE_API_URL=https://sentinel.example.org/api/v1 and
# VITE_SOCKET_URL=https://sentinel.example.org, then copy client/dist to /var/www/sentinelai.
server {
    listen 80;
    server_name sentinel.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sentinel.example.org;

    ssl_certificate     /etc/ssl/sentinelai/fullchain.pem;
    ssl_certificate_key /etc/ssl/sentinelai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;   # agent scan results

    root /var/www/sentinelai;
    location / { try_files $uri /index.html; }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /health { proxy_pass http://127.0.0.1:5000; }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
